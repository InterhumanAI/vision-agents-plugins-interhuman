description = "Interhuman streaming plugin example for Vision Agents"
requires-python = ">=3.10,<3.14"
dependencies = [
    "python-dotenv>=1.0",
    "vision-agents",
    "vision-agents-plugins-interhuman-streaming",
    "vision-agents-plugins-getstream",
    "vision-agents-plugins-deepgram",
