[project]
name = "vision-agents-plugins-interhuman-workspace"
version = "0.0.0"
description = "Social intelligence plugins for Vision Agents — detect behavioral signals, track engagement, and score conversation quality"
requires-python = ">=3.10"

[tool.uv.workspace]
members = ["streaming", "analysis"]

[tool.uv.sources]
"vision-agents-plugins-interhuman-streaming" = { workspace = true }
"vision-agents-plugins-interhuman-analysis" = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "vision-agents-plugins-interhuman-streaming",
    "vision-agents-plugins-interhuman-analysis",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "**/.venv", "example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: live-API integration tests",
]
testpaths = ["streaming/tests", "analysis/tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "streaming:analysis"
packages = [
    "vision_agents.plugins.interhuman_streaming",
    "vision_agents.plugins.interhuman_analysis",
]
