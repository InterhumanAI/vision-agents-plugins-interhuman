[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vision-agents-plugins-interhuman"
dynamic = ["version"]
description = "Interhuman social-signal streaming plugin for Vision Agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "vision-agents>=0.6.2,<0.7",
    "av>=12.0.0",
    "numpy>=1.26.0",
    "websockets>=14.0",
]

[project.urls]
Documentation = "https://docs.interhuman.ai/"
Website = "https://www.interhuman.ai/"
Source = "https://github.com/InterhumanAI/vision-agents-plugins-interhuman"

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["vision_agents"]

[tool.hatch.build.targets.sdist]
include = [
    "vision_agents",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: live-API integration tests (requires INTERHUMAN_API_KEY)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
packages = ["vision_agents.plugins.interhuman"]
